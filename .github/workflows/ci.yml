name: Elixir CI

on:
  push:
  pull_request:

env:
  MIX_ENV: test

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shibasou_shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "28.0"

      - name: Restore Mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: |
          mix format --check-formatted || (
            echo "::error ::mix format --check-formatted が失敗しました。ローカルで 'mix format' を実行してから push してください。"
            exit 1
          )

      - name: Security scan
        run: mix sobelow --exit --threshold Medium

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
        run: mix test

