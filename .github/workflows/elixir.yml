name: Elixir CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres は tests で使う。lint/dialyzer には不要だが、単一ジョブでまとめます。
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/shibasou_shop_test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      # ── Caches ────────────────────────────────────────────────────────────────
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}

      - name: Cache _build (test)
        uses: actions/cache@v4
        with:
          path: _build
          key: build-test-${{ runner.os }}-${{ hashFiles('**/mix.lock') }}

      # Dialyzer PLT は ~/.mix と priv/plts のどちらかに作られます
      - name: Cache Dialyzer PLTs
        uses: actions/cache@v4
        with:
          path: |
            ~/.mix
            priv/plts
          key: plt-${{ runner.os }}-otp
